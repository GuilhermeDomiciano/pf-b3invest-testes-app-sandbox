# Mobile regression — BrowserStack App Automate
# Contrato Robot alinhado ao runtime local (ADR 0005):
#   PLATFORM_NAME, ENVIRONMENT=bs, USERNAME_BS, ACESSKEY_BS, APP_*_BS
# GitHub Environment (cer|dev|prd) ≠ ENVIRONMENT do Robot.
name: Mobile Regression Tests
run-name: Mobile Regression • ${{ inputs.platform }} • ${{ inputs.environment }}${{ inputs.tag && format(' • {0}', inputs.tag) || '' }}${{ inputs.upload_new_build && ' • novo build' || '' }}

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plataforma alvo'
        required: true
        type: choice
        options:
          - android
          - ios
          - both
        default: android
      upload_new_build:
        description: 'Upload de novo build para o BrowserStack?'
        required: true
        type: boolean
        default: true
      delivery_run_id:
        description: 'Opcional. Run ID (só números). Vazio/latest/auto/true = último artifact no delivery_repo.'
        required: false
        type: string
        default: ''
      delivery_repo:
        description: 'owner/repo do Pipeline Deploy CERT que publica android-apk/ios-ipa (default: pf-b3invest-app-base)'
        required: false
        type: string
        default: 'b3sa/pf-b3invest-app-base'
      existing_app_url_android:
        description: 'app_url BrowserStack Android (se upload_new_build=false)'
        required: false
        type: string
        default: ''
      existing_app_url_ios:
        description: 'app_url BrowserStack iOS (se upload_new_build=false)'
        required: false
        type: string
        default: ''
      suite:
        description: 'Suite sob robot/tests/ (ex: login, wallet). Vazio = robot/tests/'
        required: false
        type: string
        default: ''
      tag:
        description: 'Tag Robot (-i). Ex: acesso, regressivo. Vazio = todas'
        required: false
        type: string
        default: ''
      environment:
        description: 'GitHub Environment / rótulo de build (cer|dev|prd) — Robot usa sempre ENVIRONMENT=bs'
        required: true
        type: choice
        options:
          - dev
          - cer
          - prd
        default: cer
      device_android:
        description: 'Dispositivo Android no BrowserStack'
        required: false
        type: string
        default: 'Google Pixel 8'
      os_version_android:
        description: 'Versão do Android'
        required: false
        type: string
        default: '14.0'
      device_ios:
        description: 'Dispositivo iOS no BrowserStack'
        required: false
        type: string
        default: 'iPhone 15 Pro'
      os_version_ios:
        description: 'Versão do iOS'
        required: false
        type: string
        default: '17'
      caller_repo:
        description: 'Repositório que disparou os testes'
        required: false
        type: string
        default: ''

  workflow_call:
    inputs:
      platform:
        type: string
        required: false
        default: 'android'
      upload_new_build:
        type: boolean
        required: false
        default: true
      delivery_run_id:
        type: string
        required: false
        default: ''
      delivery_repo:
        type: string
        required: false
        default: 'b3sa/pf-b3invest-app-base'
      existing_app_url_android:
        type: string
        required: false
        default: ''
      existing_app_url_ios:
        type: string
        required: false
        default: ''
      suite:
        type: string
        required: false
        default: ''
      tag:
        type: string
        required: false
        default: ''
      environment:
        type: string
        required: false
        default: 'cer'
      device_android:
        type: string
        required: false
        default: 'Google Pixel 8'
      os_version_android:
        type: string
        required: false
        default: '14.0'
      device_ios:
        type: string
        required: false
        default: 'iPhone 15 Pro'
      os_version_ios:
        type: string
        required: false
        default: '17'
      caller_repo:
        type: string
        required: false
        default: ''
    secrets:
      BROWSERSTACK_USERNAME:
        required: true
      BROWSERSTACK_ACCESS_KEY:
        required: true
      PIPELINE_COMMIT_PAT:
        required: true
      OPENAI_API_KEY:
        required: false

env:
  # Caller do Flutter Deploy CERT (artifacts ficam no run do caller, nao no reusable-workflows).
  # Pipeline: pf-b3invest-app-base → workflow-flutter-delivery-cert.yml
  DELIVERY_REPO: ${{ inputs.delivery_repo }}
  # Sempre BrowserStack no Robot; inputs.environment é só GitHub Environment / BUILD_BS
  ROBOT_ENVIRONMENT: bs

jobs:
  # ================================================================
  # JOB 1: Download artifacts do workflow de delivery (cross-repo)
  # ================================================================
  download-artifacts:
    name: Download Build Artifacts
    if: inputs.upload_new_build == true
    runs-on: [self-hosted, aks]
    environment: ${{ inputs.environment }}
    env:
      https_proxy: ${{ vars.HTTPS_PROXY }}
      http_proxy: ${{ vars.HTTP_PROXY }}
      no_proxy: ${{ vars.NO_PROXY }}
    outputs:
      has_apk: ${{ steps.check-files.outputs.has_apk }}
      has_ipa: ${{ steps.check-files.outputs.has_ipa }}
      delivery_run_id: ${{ steps.resolve.outputs.run_id }}
    steps:
      - name: Resolve delivery run ID
        id: resolve
        shell: bash
        env:
          DELIVERY_RUN_ID: ${{ inputs.delivery_run_id }}
          PLATFORM: ${{ inputs.platform }}
          GH_TOKEN: ${{ secrets.PIPELINE_COMMIT_PAT }}
        run: |
          set -euo pipefail
          RAW="${DELIVERY_RUN_ID:-}"
          RAW_LC="$(echo "$RAW" | tr '[:upper:]' '[:lower:]')"

          if [[ "$RAW_LC" == "false" ]]; then
            echo "ERRO: delivery_run_id='false' e invalido."
            echo "Para pular download, use upload_new_build=false + existing_app_url_*."
            exit 1
          fi

          # Explicit numeric pin
          if [[ -n "$RAW" && "$RAW" =~ ^[0-9]+$ ]]; then
            echo "Usando delivery_run_id informado: $RAW"
            echo "run_id=${RAW}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Auto: empty, latest, auto, or the common mistake "true"
          if [[ -z "$RAW" || "$RAW_LC" == "latest" || "$RAW_LC" == "auto" || "$RAW_LC" == "true" ]]; then
            echo "delivery_run_id vazio/auto ('${RAW:-<empty>}') — buscando ultimo artifact em ${DELIVERY_REPO}"
          else
            echo "ERRO: delivery_run_id deve ser numerico, vazio, latest ou auto — recebido '${RAW}'"
            exit 1
          fi

          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          repo = os.environ["DELIVERY_REPO"]
          token = os.environ["GH_TOKEN"]
          platform = os.environ.get("PLATFORM", "android").lower()

          def list_run_ids(artifact_name: str) -> list[int]:
              url = (
                  f"https://api.github.com/repos/{repo}/actions/artifacts"
                  f"?name={artifact_name}&per_page=30"
              )
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "pf-b3invest-testes-app-regression",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      payload = json.load(resp)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  print(f"ERRO API artifacts name={artifact_name}: HTTP {exc.code}\n{body}", file=sys.stderr)
                  if exc.code == 404:
                      print(
                          "HTTP 404 em list-artifacts geralmente significa:\n"
                          f"  1) PIPELINE_COMMIT_PAT sem acesso a {repo} (GitHub mascara 403 como 404)\n"
                          "  2) owner/repo incorreto (input delivery_repo)\n"
                          "  3) Actions/artifacts inexistentes nesse repo\n"
                          "Fonte esperada: b3sa/pf-b3invest-app-base → Pipeline Deploy CERT\n"
                          "  (usa reusable workflow-flutter-delivery-cert.yml; artifacts no run do caller).\n"
                          "Ex.: delivery_repo=b3sa/pf-b3invest-app-base delivery_run_id=29493179598\n"
                          "Ou use upload_new_build=false + existing_app_url_* (bs://).",
                          file=sys.stderr,
                      )
                  sys.exit(1)

              ids: list[int] = []
              for art in payload.get("artifacts") or []:
                  if art.get("expired"):
                      continue
                  run = art.get("workflow_run") or {}
                  rid = run.get("id")
                  if rid is not None:
                      ids.append(int(rid))
              return ids

          need_apk = platform in ("android", "both")
          need_ipa = platform in ("ios", "both")

          apk_ids = list_run_ids("android-apk") if need_apk else []
          ipa_ids = list_run_ids("ios-ipa") if need_ipa else []

          if need_apk and not apk_ids:
              print("ERRO: nenhum artifact nao expirado 'android-apk' em " + repo, file=sys.stderr)
              sys.exit(1)
          if need_ipa and not ipa_ids:
              print("ERRO: nenhum artifact nao expirado 'ios-ipa' em " + repo, file=sys.stderr)
              sys.exit(1)

          if need_apk and need_ipa:
              ipa_set = set(ipa_ids)
              resolved = next((rid for rid in apk_ids if rid in ipa_set), None)
              if resolved is None:
                  print(
                      "ERRO: nao ha run recente com android-apk E ios-ipa. "
                      "Informe delivery_run_id manualmente ou rode platform=android|ios.",
                      file=sys.stderr,
                  )
                  sys.exit(1)
          elif need_apk:
              resolved = apk_ids[0]
          else:
              resolved = ipa_ids[0]

          print(f"Resolvido automaticamente: delivery_run_id={resolved}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"run_id={resolved}\n")
          PY

      - name: Download APK artifact
        if: inputs.platform == 'android' || inputs.platform == 'both'
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: ./artifacts/android/
          github-token: ${{ secrets.PIPELINE_COMMIT_PAT }}
          repository: ${{ env.DELIVERY_REPO }}
          run-id: ${{ steps.resolve.outputs.run_id }}

      - name: Download IPA artifact
        if: inputs.platform == 'ios' || inputs.platform == 'both'
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: ./artifacts/ios/
          github-token: ${{ secrets.PIPELINE_COMMIT_PAT }}
          repository: ${{ env.DELIVERY_REPO }}
          run-id: ${{ steps.resolve.outputs.run_id }}

      - name: Check downloaded files
        id: check-files
        shell: bash
        run: |
          echo "===== Artifacts baixados ====="
          find ./artifacts/ -type f 2>/dev/null | head -40

          APK_FILE="$(find ./artifacts -type f -name 'app-cert-release.apk' | head -1 || true)"
          if [ -z "${APK_FILE}" ]; then
            APK_FILE="$(find ./artifacts -type f -name '*.apk' | head -1 || true)"
          fi
          IPA_FILE="$(find ./artifacts -type f -name 'b3i_app_base.ipa' | head -1 || true)"
          if [ -z "${IPA_FILE}" ]; then
            IPA_FILE="$(find ./artifacts -type f -name '*.ipa' | head -1 || true)"
          fi

          if [ -n "${APK_FILE}" ]; then
            echo "has_apk=true" >> "$GITHUB_OUTPUT"
            echo "APK: ${APK_FILE} ($(du -h "${APK_FILE}" | cut -f1))"
          else
            echo "has_apk=false" >> "$GITHUB_OUTPUT"
            echo "Nenhum APK encontrado"
          fi

          if [ -n "${IPA_FILE}" ]; then
            echo "has_ipa=true" >> "$GITHUB_OUTPUT"
            echo "IPA: ${IPA_FILE} ($(du -h "${IPA_FILE}" | cut -f1))"
          else
            echo "has_ipa=false" >> "$GITHUB_OUTPUT"
            echo "Nenhum IPA encontrado (esperado: b3i_app_base.ipa dentro do artifact ios-ipa)"
          fi

      - name: Upload artifacts for next job
        uses: actions/upload-artifact@v4
        with:
          name: mobile-binaries
          path: ./artifacts/
          retention-days: 1

  # ================================================================
  # JOB 2: Upload para BrowserStack (scripts/bs_upload_app.py)
  # ================================================================
  upload-to-browserstack:
    name: Upload to BrowserStack
    if: inputs.upload_new_build == true
    needs: [download-artifacts]
    runs-on: [self-hosted, aks]
    environment: ${{ inputs.environment }}
    env:
      https_proxy: ${{ vars.HTTPS_PROXY }}
      http_proxy: ${{ vars.HTTP_PROXY }}
      no_proxy: ${{ vars.NO_PROXY }}
      USERNAME_BS: ${{ secrets.BROWSERSTACK_USERNAME }}
      ACESSKEY_BS: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BS_SSL_VERIFY: 'false'
      APP_ENV: ${{ inputs.environment }}
    outputs:
      app_url_android: ${{ steps.upload-android.outputs.app_url }}
      app_url_ios: ${{ steps.upload-ios.outputs.app_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PIPELINE_COMMIT_PAT }}

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: mobile-binaries
          path: ./artifacts/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install upload deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install 'requests>=2.28' 'python-dotenv>=1.0'

      - name: Upload APK to BrowserStack
        id: upload-android
        if: |
          (inputs.platform == 'android' || inputs.platform == 'both') &&
          needs.download-artifacts.outputs.has_apk == 'true'
        shell: bash
        run: |
          set -e
          APK_FILE="$(find ./artifacts -type f -name 'app-cert-release.apk' | head -1 || true)"
          if [ -z "${APK_FILE}" ]; then
            APK_FILE="$(find ./artifacts -type f -name '*.apk' | head -1)"
          fi
          echo "Uploading APK: ${APK_FILE} ($(du -h "${APK_FILE}" | cut -f1))"
          CUSTOM_ID="b3invest-${APP_ENV}-android"
          APP_URL=$(python scripts/bs_upload_app.py \
            --file "${APK_FILE}" \
            --platform android \
            --custom-id "${CUSTOM_ID}" \
            --insecure)
          if [ -z "${APP_URL}" ] || [[ "${APP_URL}" != bs://* ]]; then
            echo "Upload Android falhou. Saida: ${APP_URL}"
            exit 1
          fi
          echo "app_url=${APP_URL}" >> "$GITHUB_OUTPUT"
          echo "Android app_url: ${APP_URL}"

      - name: Upload IPA to BrowserStack
        id: upload-ios
        if: |
          (inputs.platform == 'ios' || inputs.platform == 'both') &&
          needs.download-artifacts.outputs.has_ipa == 'true'
        shell: bash
        run: |
          set -e
          # Preferir o IPA do Deploy CERT (ex.: b3i_app_base.ipa); nao exige path Windows local.
          IPA_FILE="$(find ./artifacts -type f -name 'b3i_app_base.ipa' | head -1 || true)"
          if [ -z "${IPA_FILE}" ]; then
            IPA_FILE="$(find ./artifacts -type f -name '*.ipa' | head -1)"
          fi
          if [ -z "${IPA_FILE}" ]; then
            echo "ERRO: nenhum .ipa sob ./artifacts (esperado b3i_app_base.ipa no artifact ios-ipa)"
            find ./artifacts -type f | head -40
            exit 1
          fi
          echo "Uploading IPA: ${IPA_FILE} ($(du -h "${IPA_FILE}" | cut -f1))"
          CUSTOM_ID="b3invest-${APP_ENV}-ios"
          APP_URL=$(python scripts/bs_upload_app.py \
            --file "${IPA_FILE}" \
            --platform ios \
            --custom-id "${CUSTOM_ID}" \
            --insecure)
          if [ -z "${APP_URL}" ] || [[ "${APP_URL}" != bs://* ]]; then
            echo "Upload iOS falhou. Saida: ${APP_URL}"
            exit 1
          fi
          echo "app_url=${APP_URL}" >> "$GITHUB_OUTPUT"
          echo "iOS app_url: ${APP_URL}"

      - name: Upload summary
        if: always()
        shell: bash
        run: |
          {
            echo "## BrowserStack Upload"
            echo ""
            echo "| Plataforma | App URL | Custom ID |"
            echo "|---|---|---|"
            if [ -n "${{ steps.upload-android.outputs.app_url }}" ]; then
              echo "| Android | \`${{ steps.upload-android.outputs.app_url }}\` | b3invest-${APP_ENV}-android |"
            fi
            if [ -n "${{ steps.upload-ios.outputs.app_url }}" ]; then
              echo "| iOS | \`${{ steps.upload-ios.outputs.app_url }}\` | b3invest-${APP_ENV}-ios |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ================================================================
  # JOB 3: Executar testes Android
  # ================================================================
  test-android:
    name: Execute Tests (Android)
    if: |
      always() && !cancelled() &&
      (inputs.platform == 'android' || inputs.platform == 'both') &&
      (inputs.upload_new_build == false || needs.upload-to-browserstack.result == 'success')
    needs: [upload-to-browserstack]
    runs-on: [self-hosted, aks]
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      https_proxy: ${{ vars.HTTPS_PROXY }}
      http_proxy: ${{ vars.HTTP_PROXY }}
      no_proxy: ${{ vars.NO_PROXY }}
      USERNAME_BS: ${{ secrets.BROWSERSTACK_USERNAME }}
      ACESSKEY_BS: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      PLATFORM_NAME: android
      DEVICE_NAME_ANDROID_BS: ${{ inputs.device_android }}
      PLATFORM_VERSION_ANDROID_BS: ${{ inputs.os_version_android }}
      APP_ENV: ${{ inputs.environment }}
      APP_ANDROID_BS: ${{ inputs.upload_new_build == true && needs.upload-to-browserstack.outputs.app_url_android || inputs.existing_app_url_android }}
    steps:
      - name: Validate APP_ANDROID_BS
        shell: bash
        run: |
          if [ -z "${APP_ANDROID_BS}" ]; then
            echo "ERRO: Nenhum APP_ANDROID_BS (bs://) disponivel."
            echo "Use upload (delivery_run_id) ou existing_app_url_android."
            exit 1
          fi
          echo "APP_ANDROID_BS: ${APP_ANDROID_BS}"
          echo "Device: ${DEVICE_NAME_ANDROID_BS} (Android ${PLATFORM_VERSION_ANDROID_BS})"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PIPELINE_COMMIT_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: config/requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r config/requirements.txt

      - name: Create .env for execution
        shell: bash
        run: |
          {
            echo "PLATFORM_NAME=android"
            echo "ENVIRONMENT=bs"
            echo "USERNAME_BS=${USERNAME_BS}"
            echo "ACESSKEY_BS=${ACESSKEY_BS}"
            echo "APP_ANDROID_BS=${APP_ANDROID_BS}"
            echo "DEVICE_NAME_ANDROID_BS=${DEVICE_NAME_ANDROID_BS}"
            echo "PLATFORM_VERSION_ANDROID_BS=${PLATFORM_VERSION_ANDROID_BS}"
            echo "BUILD_BS=gha-${APP_ENV}-${{ github.run_number }}-android"
            echo "BUILD_NUMBER=${{ github.run_number }}"
            echo "PROJECT_NAME_BS=Automacao APP B3i"
            echo "BS_SSL_VERIFY=false"
          } > .env
          echo ".env criado (Android / ENVIRONMENT=bs / APP_ENV=${APP_ENV})"

      - name: Run tests
        id: run_tests
        shell: bash
        env:
          TAG_INPUT: ${{ inputs.tag }}
          SUITE_INPUT: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          RESULTS_DIR="logs/ci/android"
          mkdir -p "${RESULTS_DIR}"

          SUITE_PATH="robot/tests/"
          if [ -n "${SUITE_INPUT}" ]; then
            if [ -f "robot/tests/${SUITE_INPUT}.robot" ]; then
              SUITE_PATH="robot/tests/${SUITE_INPUT}.robot"
            elif [ -d "robot/tests/${SUITE_INPUT}" ]; then
              SUITE_PATH="robot/tests/${SUITE_INPUT}"
            else
              echo "Suite '${SUITE_INPUT}' nao encontrada sob robot/tests/; usando robot/tests/ + --suite"
              SUITE_PATH="robot/tests/"
            fi
          fi

          ARGS=(-v "PLATFORM_NAME:android" -v "ENVIRONMENT:bs" -d "${RESULTS_DIR}" --name "android-${APP_ENV}")
          if [ -n "${TAG_INPUT}" ]; then
            ARGS+=(-i "${TAG_INPUT}")
          fi
          if [ -n "${SUITE_INPUT}" ] && [ "${SUITE_PATH}" = "robot/tests/" ] && [ ! -f "robot/tests/${SUITE_INPUT}.robot" ] && [ ! -d "robot/tests/${SUITE_INPUT}" ]; then
            ARGS+=(--suite "${SUITE_INPUT}")
          fi
          ARGS+=("${SUITE_PATH}")

          echo "Executando: robot ${ARGS[*]}"
          robot "${ARGS[@]}"

      # --- Analise IA (revisitar em change futura; script ainda nao existe) ---
      # - name: AI log analysis
      #   if: always()
      #   continue-on-error: true
      #   shell: bash
      #   env:
      #     OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      #     OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      #     OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      #   run: |
      #     if [ -n "${OPENAI_API_KEY}" ] && [ -f "scripts/analyze_robot_results.py" ]; then
      #       python scripts/analyze_robot_results.py --platform android || echo "Analise IA indisponivel; seguindo."
      #     else
      #       echo "Analise IA nao configurada ou script ausente; seguindo."
      #     fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-report-android-${{ inputs.environment }}-${{ github.run_number }}-${{ job.status }}
          path: |
            logs/ci/android/
          retention-days: 60
          if-no-files-found: warn

      - name: Generate test summary
        if: always()
        shell: bash
        env:
          DEVICE_NAME_ANDROID_BS: ${{ inputs.device_android }}
          PLATFORM_VERSION_ANDROID_BS: ${{ inputs.os_version_android }}
          APP_ENV: ${{ inputs.environment }}
        run: |
          RESULTS_DIR="logs/ci/android"
          if [ -f "${RESULTS_DIR}/output.xml" ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          output_xml = Path("logs/ci/android/output.xml")
          if output_xml.exists():
              root = ET.parse(output_xml).getroot()
              stats = root.find('.//statistics/total/stat[@name="All Tests"]')
              if stats is not None:
                  passed = int(stats.get("pass", 0))
                  failed = int(stats.get("fail", 0))
                  skipped = int(stats.get("skip", 0))
                  total = passed + failed + skipped
                  emoji = "OK" if failed == 0 else "FAIL"
                  print(f"## {emoji} Mobile Tests — Android")
                  print("")
                  print("| Metrica | Valor |")
                  print("|---|---|")
                  print(f"| App env (GHA) | `{os.environ.get('APP_ENV', 'n/d')}` |")
                  print(f"| Robot ENVIRONMENT | `bs` |")
                  print(f"| Dispositivo | `{os.environ.get('DEVICE_NAME_ANDROID_BS', 'n/d')}` (Android {os.environ.get('PLATFORM_VERSION_ANDROID_BS', 'n/d')}) |")
                  print(f"| Total | {total} |")
                  print(f"| Passed | {passed} |")
                  print(f"| Failed | {failed} |")
                  print(f"| Skipped | {skipped} |")
                  print(f"| Taxa | {(passed/total*100):.1f}% |" if total else "| Taxa | N/A |")
              else:
                  print("## WARN Mobile Tests — Android")
                  print("Nao foi possivel extrair estatisticas do output.xml")
          else:
              print("## WARN Mobile Tests — Android")
              print("output.xml nao encontrado")
          PY
          else
            echo "## WARN Mobile Tests — Android" >> "$GITHUB_STEP_SUMMARY"
            echo "Nenhum resultado gerado." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ================================================================
  # JOB 4: Executar testes iOS
  # ================================================================
  test-ios:
    name: Execute Tests (iOS)
    if: |
      always() && !cancelled() &&
      (inputs.platform == 'ios' || inputs.platform == 'both') &&
      (inputs.upload_new_build == false || needs.upload-to-browserstack.result == 'success')
    needs: [upload-to-browserstack]
    runs-on: [self-hosted, aks]
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      https_proxy: ${{ vars.HTTPS_PROXY }}
      http_proxy: ${{ vars.HTTP_PROXY }}
      no_proxy: ${{ vars.NO_PROXY }}
      USERNAME_BS: ${{ secrets.BROWSERSTACK_USERNAME }}
      ACESSKEY_BS: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      PLATFORM_NAME: ios
      DEVICE_NAME_IOS_BS: ${{ inputs.device_ios }}
      PLATFORM_VERSION_IOS_BS: ${{ inputs.os_version_ios }}
      APP_ENV: ${{ inputs.environment }}
      APP_IOS_BS: ${{ inputs.upload_new_build == true && needs.upload-to-browserstack.outputs.app_url_ios || inputs.existing_app_url_ios }}
    steps:
      - name: Validate APP_IOS_BS
        shell: bash
        run: |
          if [ -z "${APP_IOS_BS}" ]; then
            echo "ERRO: Nenhum APP_IOS_BS (bs://) disponivel."
            echo "Use upload (delivery_run_id) ou existing_app_url_ios."
            exit 1
          fi
          echo "APP_IOS_BS: ${APP_IOS_BS}"
          echo "Device: ${DEVICE_NAME_IOS_BS} (iOS ${PLATFORM_VERSION_IOS_BS})"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PIPELINE_COMMIT_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: config/requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r config/requirements.txt

      - name: Create .env for execution
        shell: bash
        run: |
          {
            echo "PLATFORM_NAME=ios"
            echo "ENVIRONMENT=bs"
            echo "USERNAME_BS=${USERNAME_BS}"
            echo "ACESSKEY_BS=${ACESSKEY_BS}"
            echo "APP_IOS_BS=${APP_IOS_BS}"
            echo "DEVICE_NAME_IOS_BS=${DEVICE_NAME_IOS_BS}"
            echo "PLATFORM_VERSION_IOS_BS=${PLATFORM_VERSION_IOS_BS}"
            echo "BUILD_BS=gha-${APP_ENV}-${{ github.run_number }}-ios"
            echo "BUILD_NUMBER=${{ github.run_number }}"
            echo "PROJECT_NAME_BS=Automacao APP B3i"
            echo "BS_SSL_VERIFY=false"
          } > .env
          echo ".env criado (iOS / ENVIRONMENT=bs / APP_ENV=${APP_ENV})"

      - name: Run tests
        id: run_tests
        shell: bash
        env:
          TAG_INPUT: ${{ inputs.tag }}
          SUITE_INPUT: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          RESULTS_DIR="logs/ci/ios"
          mkdir -p "${RESULTS_DIR}"

          SUITE_PATH="robot/tests/"
          if [ -n "${SUITE_INPUT}" ]; then
            if [ -f "robot/tests/${SUITE_INPUT}.robot" ]; then
              SUITE_PATH="robot/tests/${SUITE_INPUT}.robot"
            elif [ -d "robot/tests/${SUITE_INPUT}" ]; then
              SUITE_PATH="robot/tests/${SUITE_INPUT}"
            else
              echo "Suite '${SUITE_INPUT}' nao encontrada sob robot/tests/; usando robot/tests/ + --suite"
              SUITE_PATH="robot/tests/"
            fi
          fi

          ARGS=(-v "PLATFORM_NAME:ios" -v "ENVIRONMENT:bs" -d "${RESULTS_DIR}" --name "ios-${APP_ENV}")
          if [ -n "${TAG_INPUT}" ]; then
            ARGS+=(-i "${TAG_INPUT}")
          fi
          if [ -n "${SUITE_INPUT}" ] && [ "${SUITE_PATH}" = "robot/tests/" ] && [ ! -f "robot/tests/${SUITE_INPUT}.robot" ] && [ ! -d "robot/tests/${SUITE_INPUT}" ]; then
            ARGS+=(--suite "${SUITE_INPUT}")
          fi
          ARGS+=("${SUITE_PATH}")

          echo "Executando: robot ${ARGS[*]}"
          robot "${ARGS[@]}"

      # --- Analise IA (revisitar em change futura; script ainda nao existe) ---
      # - name: AI log analysis
      #   if: always()
      #   continue-on-error: true
      #   shell: bash
      #   env:
      #     OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      #     OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      #     OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      #   run: |
      #     if [ -n "${OPENAI_API_KEY}" ] && [ -f "scripts/analyze_robot_results.py" ]; then
      #       python scripts/analyze_robot_results.py --platform ios || echo "Analise IA indisponivel; seguindo."
      #     else
      #       echo "Analise IA nao configurada ou script ausente; seguindo."
      #     fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-report-ios-${{ inputs.environment }}-${{ github.run_number }}-${{ job.status }}
          path: |
            logs/ci/ios/
          retention-days: 60
          if-no-files-found: warn

      - name: Generate test summary
        if: always()
        shell: bash
        env:
          DEVICE_NAME_IOS_BS: ${{ inputs.device_ios }}
          PLATFORM_VERSION_IOS_BS: ${{ inputs.os_version_ios }}
          APP_ENV: ${{ inputs.environment }}
        run: |
          RESULTS_DIR="logs/ci/ios"
          if [ -f "${RESULTS_DIR}/output.xml" ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          output_xml = Path("logs/ci/ios/output.xml")
          if output_xml.exists():
              root = ET.parse(output_xml).getroot()
              stats = root.find('.//statistics/total/stat[@name="All Tests"]')
              if stats is not None:
                  passed = int(stats.get("pass", 0))
                  failed = int(stats.get("fail", 0))
                  skipped = int(stats.get("skip", 0))
                  total = passed + failed + skipped
                  emoji = "OK" if failed == 0 else "FAIL"
                  print(f"## {emoji} Mobile Tests — iOS")
                  print("")
                  print("| Metrica | Valor |")
                  print("|---|---|")
                  print(f"| App env (GHA) | `{os.environ.get('APP_ENV', 'n/d')}` |")
                  print(f"| Robot ENVIRONMENT | `bs` |")
                  print(f"| Dispositivo | `{os.environ.get('DEVICE_NAME_IOS_BS', 'n/d')}` (iOS {os.environ.get('PLATFORM_VERSION_IOS_BS', 'n/d')}) |")
                  print(f"| Total | {total} |")
                  print(f"| Passed | {passed} |")
                  print(f"| Failed | {failed} |")
                  print(f"| Skipped | {skipped} |")
                  print(f"| Taxa | {(passed/total*100):.1f}% |" if total else "| Taxa | N/A |")
              else:
                  print("## WARN Mobile Tests — iOS")
                  print("Nao foi possivel extrair estatisticas do output.xml")
          else:
              print("## WARN Mobile Tests — iOS")
              print("output.xml nao encontrado")
          PY
          else
            echo "## WARN Mobile Tests — iOS" >> "$GITHUB_STEP_SUMMARY"
            echo "Nenhum resultado gerado." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ================================================================
  # JOB 5: Consolidar relatorios
  # ================================================================
  consolidate-report:
    name: Consolidate Report
    if: always() && !cancelled()
    needs: [test-android, test-ios]
    runs-on: [self-hosted, aks]
    environment: ${{ inputs.environment }}
    env:
      https_proxy: ${{ vars.HTTPS_PROXY }}
      http_proxy: ${{ vars.HTTP_PROXY }}
      no_proxy: ${{ vars.NO_PROXY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PIPELINE_COMMIT_PAT }}

      - name: Download Android results
        if: needs.test-android.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          pattern: mobile-report-android-*
          path: logs/ci/android/
          merge-multiple: true
        continue-on-error: true

      - name: Download iOS results
        if: needs.test-ios.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          pattern: mobile-report-ios-*
          path: logs/ci/ios/
          merge-multiple: true
        continue-on-error: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Robot Framework
        shell: bash
        run: pip install robotframework

      - name: Merge results with rebot
        shell: bash
        run: |
          OUTPUTS=()
          for f in logs/ci/android/output*.xml logs/ci/ios/output*.xml; do
            if [ -f "$f" ]; then
              OUTPUTS+=("$f")
            fi
          done

          mkdir -p logs/ci/merged
          if [ "${#OUTPUTS[@]}" -gt 0 ]; then
            rebot --name "mobile-consolidated" --outputdir logs/ci/merged "${OUTPUTS[@]}"
            echo "Relatorio consolidado em logs/ci/merged/"
          else
            echo "Nenhum output.xml encontrado para consolidar"
            echo "Nenhum resultado disponivel" > logs/ci/merged/README.txt
          fi

      - name: Upload consolidated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-report-consolidated-${{ inputs.environment }}-${{ github.run_number }}-${{ job.status }}
          path: logs/ci/merged/
          retention-days: 60
          if-no-files-found: warn

      - name: Generate consolidated summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Mobile Regression — Consolidated"
            echo ""
            echo "| Parametro | Valor |"
            echo "|---|---|"
            echo "| Plataforma | \`${{ inputs.platform }}\` |"
            echo "| App env (GHA) | \`${{ inputs.environment }}\` |"
            echo "| Robot ENVIRONMENT | \`bs\` |"
            echo "| Suite | \`${{ inputs.suite || 'robot/tests/' }}\` |"
            echo "| Tag | \`${{ inputs.tag || 'todas' }}\` |"
            echo "| Novo Upload | ${{ inputs.upload_new_build }} |"
            echo "| Android | ${{ needs.test-android.result }} |"
            echo "| iOS | ${{ needs.test-ios.result }} |"
            echo "| Run | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
          } >> "$GITHUB_STEP_SUMMARY"
