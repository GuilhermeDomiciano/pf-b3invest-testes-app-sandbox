BTN_WALLET_EVOLUÇÃO_PATRIMONIAL: accessibility_id=Evolução patrimonial

STATEMENT_HIDE_STATEMENT: "accessibility_id=Ocultar valores"
# Accessibility IDs (content-desc)
STATEMENT_ACS_STATEMENT: "accessibility_id=Extrato"
STATEMENT_ACS_UPDATED: "xpath=//*[matches(@content-desc,'^Atualizado em [0-9]+ de [A-Za-zÀ-ÿ\\s]+$')]"
STATEMENT_ACS_TOTAL_VALUE: "xpath=//*[matches(@content-desc,'^R\\$ [0-9]{1,3}(\\.[0-9]{3})*,[0-9]{2}$')]"
# +R\\$ [0-9]
STATEMENT_ACS_APPRECIATED: "xpath=//*[matches(@content-desc,'^[A-Za-zÀ-ÿ\\s]+ R\\$ [0-9]{1,3}(\\.[0-9]{3})*,[0-9]{2}$')]"
STATEMENT_ACS_VARIATION: "xpath=//*[matches(@content-desc,'^\\([+-]?[0-9]+%\\) em [0-9]+ dias$')]"

# "accessibility_id=(+0%) em 30 dias"
STATEMENT_ACS_FUTURE_ENTRIES: "accessibility_id=Lançamentos futuros"
STATEMENT_ACS_SHOW_FUTURE_ENTRIES: "accessibility_id=Mostrar lançamentos futuros"
STATEMENT_ACS_LAST_ENTRIES: "accessibility_id=Últimos lançamentos"
STATEMENT_ACS_ENTRY_DATE: "xpath=//*[matches(@content-desc,'^[0-9]+ de [A-Za-zÀ-ÿ\\s]+$')]"
STATEMENT_ACS_GENIAL: "accessibility_id=Genial"
STATEMENT_ACS_AMTH3: "accessibility_id=AMTH3"
