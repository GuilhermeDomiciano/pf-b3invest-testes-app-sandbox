STATEMENT_ACS_NAV_MENU: "accessibility_id=Abrir menu"
LOAD_MORE: "accessibility_id=Carregar mais"
EMPTY_STATEMENT_MESSAGE: "accessibility_id=Seu extrato está vazio no momento. Em breve, suas transações serão exibidas aqui."
