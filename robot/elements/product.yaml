# ALL_PRODUCTS_BALANCE: "accessibility_id=R$ 1.234.567.890,12"
# Validação exata usando apenas regex (sem contains)
ALL_PRODUCTS_BALANCE: "xpath=//*[matches(@content-desc,'^R\\$ [0-9]{1,3}(\\.[0-9]{3})*,[0-9]{2}$')] em"
# Alternativa para texto exato específico (substituir 'TEXTO_EXATO' pelo valor desejado)
ALL_PRODUCTS_BALANCE_EXACT: "xpath=//*[@content-desc='TEXTO_EXATO']"
ALL_PRODUCTS_INSTITUTIONS_COUNT_FIXED: "xpath=//*[matches(@content-desc,'^[A-Za-z0-9À-ÿ\\s\\-\\.]+$')]" 
# BTN_RENDA_FIXA original: "accessibility_id=Renda Fixa\n5 produtos em renda fixa"
BTN_RENDA_FIXA: "xpath=//*[matches(@content-desc,'^Renda Fixa\\n[0-9]+ produtos em renda fixa$')]"
BTN_RENDA_VARIAVEL: "xpath=//*[matches(@content-desc,'^Renda Variável\\n[0-9]+ produtos em renda variável$')]"
BTN_INTERNACIONAL: "xpath=//*[matches(@content-desc,'^Internacional\\n[0-9]+ produtos em internacional$')]"
# CARD_RENDA_FIXA original: "xpath=//*[matches(@content-desc,'^CCB\\n[0-9]+ ativos\\n0.2% da carteira\\nR\\$ 5.000,00$')]"
CARD_RENDA_FIXA: "xpath=//*[matches(@content-desc,'^[A-Za-zÀ-ÿ\\s]+\\n[0-9]+ ativos\\n[0-9]+\\.[0-9]+% da carteira\\nR\\$ [0-9]{1,3}(\\.[0-9]{3})*,[0-9]{2}$')]"

CARD_RENDA_FIXA_RESOURCE_ID: "xpath=//android.view.View[@resource-id='product_card_title']"
# Variações de regex para diferentes casos de texto
ALL_PRODUCTS_TEXT_SIMPLE: "xpath=//*[matches(@content-desc,'^[A-Za-z\\s]+$')]"              # Apenas letras e espaços
ALL_PRODUCTS_TEXT_ACCENTS: "xpath=//*[matches(@content-desc,'^[A-Za-zÀ-ÿ\\s]+$')]"          # Com acentos portugueses
ALL_PRODUCTS_TEXT_MIXED: "xpath=//*[matches(@content-desc,'^[A-Za-z0-9À-ÿ\\s\\-\\.]+$')]"   # Letras, números, acentos, hífen, ponto
BTN_WALLET_BACK: "accessibility_id=Voltar"
HOME_SCREEN_IDENTIFIER: "accessibility_id=Acesso Rápido"
ALL_PRODUCTS_QUANTITY: "accessibility_id=Todos os produtos"
ALL_PRODUCTS_ASSETS_COUNT: "accessibility_id=Valorizou R$ 123.456.789,00"
ALL_PRODUCTS_INSTITUTIONS_COUNT: "accessibility_id=74 ativos em 5 instituições"
BTN_LOAD_MORE: "accessibility_id=Carregar +8"