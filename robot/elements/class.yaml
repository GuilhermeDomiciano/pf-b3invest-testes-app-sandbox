ALL_CLASSES_QUANTITY: "accessibility_id=Classes"

# Valores fixos (originais - manter como fallback)
ALL_CLASSES_ASSETS_COUNT_FIXED: "accessibility_id=R$ 2.560.006,04"
ALL_CLASSES_INSTITUTIONS_COUNT_FIXED: "accessibility_id=7 produtos em 3 classes na sua carteira"

# Alternativas com XPath e regex para valores dinâmicos
ALL_CLASSES_ASSETS_COUNT: "xpath=//*[contains(@content-desc,'R$') and matches(@content-desc,'^R\\$ [0-9]{1,3}(\\.[0-9]{3})*,[0-9]{2}$')]"
ALL_CLASSES_INSTITUTIONS_COUNT: "xpath=//*[matches(@content-desc,'^[0-9]+ produtos em [0-9]+ classe[s]? na sua carteira$')]"

# Alternativas mais flexíveis (caso as acima não funcionem)
ALL_CLASSES_ASSETS_COUNT_FLEXIBLE: "xpath=//*[contains(@content-desc,'R$') and contains(@content-desc,',')]"
ALL_CLASSES_INSTITUTIONS_COUNT_FLEXIBLE: "xpath=//*[contains(@content-desc,'produtos em') and contains(@content-desc,'classe') and contains(@content-desc,'carteira')]"

# Para validação de padrões específicos (usar em keywords)
REGEX_CURRENCY_PATTERN: "^R\\$ [0-9]{1,3}(\\.[0-9]{3})*,[0-9]{2}$"
REGEX_PRODUCTS_PATTERN: "^[0-9]+ produtos em [0-9]+ classe[s]? na sua carteira$"