# Valida apenas se existe o texto 'produtos nesta instituição' no content-desc, ignorando o que vem antes
INSTITUTION_CARD_CONTAINS: "xpath=//*[contains(@content-desc, 'produtos nesta instituição')]"
# Parte comum do content-desc dos cards de instituição
INSTITUTION_CARD_COMMON: "produtos nesta instituição"

# Regex para validar o content-desc completo, aceitando qualquer nome antes
INSTITUTION_BUTTON_REGEX: "xpath=//*[matches(@content-desc, '.*produto[s]? nesta instituição$')]"
ALL_INSTITUTIONS_QUANTITY: "accessibility_id=Produtos por instituição"
ALL_INSTITUTIONS_ASSETS_COUNT: "xpath=//*[matches(@content-desc,'^R\\$ [0-9]{1,3}(\\.[0-9]{3})*,[0-9]{2}$')]"
ALL_INSTITUTIONS_INSTITUTIONS_COUNT: "xpath=//*[matches(@content-desc,'^[0-9]+ produtos de [0-9]+ instituições na sua carteira$')]"
CARD_INSTITUTION_PRODUCT: "xpath=//*[matches(@content-desc,'^[A-Za-zÀ-ÿ\\s]+\\n[0-9]+ ativos\\n[0-9]+\\.[0-9]+% da carteira\\nR\\$ [0-9]{1,3}(\\.[0-9]{3})*,[0-9]{2}$')]"
TITLE_INTERNACIOAL: "accessibility_id=Internacional"
ALL_PRODUCT_QUANTITY: "accessibility_id=Todos os produtos"
# //android.widget.ImageView[@content-desc="CTC TESTE 123
# 5 produtos nesta instituição"]
#5 ativos
#50.99% da carteira
#R$ 11.345.680.904,24"]
#//android.widget.ImageView[@content-desc="TESTE - BCO RIO S/A
#11 produtos nesta instituição"]
PRODUCT_CARD_TITLE: xpath=//*[@resource-id="product_card_title"]
CARD_LOAD_MORE: "accessibility_id=Carregar mais 3 produtos"
CARD_LOAD_MORE_INSTITUTIONS: "accessibility_id=Carregar mais instituições financeiras"
